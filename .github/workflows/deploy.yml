# Valida o projeto, gera as imagens Docker (GHCR) e publica no servidor por SSH.
# Configuração (secrets, variables e preparo do servidor): deploy/README.md
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend:
    name: Validar backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - run: dotnet tool restore
      - run: dotnet build Backend.slnx
      - run: dotnet test Backend.slnx --no-build
      - run: dotnet format Backend.slnx --verify-no-changes

      - name: Conferir migrations em dia com o modelo
        env:
          ConnectionStrings__Default: Host=localhost;Database=ci;Username=ci;Password=ci
          Jwt__Secret: segredo-usado-apenas-para-montar-o-modelo-no-ci
          Storage__Provider: Local
        run: dotnet ef migrations has-pending-model-changes --project src/Backend.Repository --startup-project src/Backend.Api

  frontend:
    name: Validar frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      # O `npm run build` roda dentro da imagem Docker do frontend, no job seguinte.

  images:
    name: Gerar imagens
    needs: [backend, frontend]
    # O servidor é ARM (aarch64): as imagens são geradas num runner ARM, sem emulação.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image-prefix: ${{ steps.image-prefix.outputs.value }}
    steps:
      - uses: actions/checkout@v7

      - name: Conferir variáveis do frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          for name in NEXT_PUBLIC_API_URL NEXT_PUBLIC_SITE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Defina a variável $name em Settings > Secrets and variables > Actions > Variables."
              exit 1
            fi
          done

      - name: Prefixo das imagens
        id: image-prefix
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Imagem da API
        uses: docker/build-push-action@v7
        with:
          context: backend
          target: api
          push: true
          tags: |
            ${{ steps.image-prefix.outputs.value }}-api:${{ github.sha }}
            ${{ steps.image-prefix.outputs.value }}-api:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Imagem das migrations
        uses: docker/build-push-action@v7
        with:
          context: backend
          target: migrations
          push: true
          tags: |
            ${{ steps.image-prefix.outputs.value }}-migrations:${{ github.sha }}
            ${{ steps.image-prefix.outputs.value }}-migrations:latest
          cache-from: type=gha,scope=backend

      - name: Imagem do site
        uses: docker/build-push-action@v7
        with:
          context: frontend
          target: web
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_SITE_NAME=${{ vars.NEXT_PUBLIC_SITE_NAME }}
            NEXT_PUBLIC_WHATSAPP_NUMBER=${{ vars.NEXT_PUBLIC_WHATSAPP_NUMBER }}
          tags: |
            ${{ steps.image-prefix.outputs.value }}-web:${{ github.sha }}
            ${{ steps.image-prefix.outputs.value }}-web:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    name: Publicar no servidor
    needs: images
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/sitecorretora' }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: deploy

      - name: Configurar SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Defina o secret $name (veja deploy/README.md)."
              exit 1
            fi
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy-server
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Copiar arquivos de deploy
        run: |
          ssh deploy-server "mkdir -p '$DEPLOY_PATH'"
          scp deploy/compose.yaml deploy/Caddyfile deploy/deploy.sh deploy/.env.example "deploy-server:$DEPLOY_PATH/"

      - name: Subir a nova versão
        env:
          IMAGE_PREFIX: ${{ needs.images.outputs.image-prefix }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | ssh deploy-server \
            "IMAGE_PREFIX='$IMAGE_PREFIX' IMAGE_TAG='$GITHUB_SHA' REGISTRY_USER='$GITHUB_ACTOR' bash '$DEPLOY_PATH/deploy.sh'"
